<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sunbird Video Player Web Component Environment</title>
    <link rel="stylesheet" href="file:///android_asset/sunbird/video-js.min.css">
    <link rel="stylesheet" href="file:///android_asset/sunbird/sunbird-video-player.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b1120;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        #player-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
        }
        sunbird-video-player {
            display: block;
            width: 100%;
            height: 100%;
        }
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            z-index: 50;
            transition: opacity 0.3s ease;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #0ea5e9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }
    </style>

    <!-- Global Diagnostics / Error Interception before dependencies load -->
    <script>
        window.sunbirdLogs = [];
        window.sunbirdErrors = [];
        window.lastPlayerEvents = [];

        function addLog(level, msg) {
            var item = { time: new Date().toLocaleTimeString(), level: level, msg: String(msg) };
            window.sunbirdLogs.push(item);
            if (window.sunbirdLogs.length > 50) window.sunbirdLogs.shift();
            if (window.SunbirdBridge && window.SunbirdBridge.log) {
                try { window.SunbirdBridge.log(level + ': ' + msg); } catch(e) {}
            }
        }

        window.onerror = function(msg, url, line, col, error) {
            var errStr = msg + ' (' + url + ':' + line + ')';
            window.sunbirdErrors.push(errStr);
            addLog('ERROR', errStr);
            return false;
        };

        window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason ? (event.reason.message || String(event.reason)) : 'Unhandled Promise Rejection';
            window.sunbirdErrors.push(reason);
            addLog('PROMISE_ERROR', reason);
        });

        var origLog = console.log;
        console.log = function() {
            var args = Array.prototype.slice.call(arguments).join(' ');
            addLog('INFO', args);
            origLog.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
            var args = Array.prototype.slice.call(arguments).join(' ');
            addLog('WARN', args);
            origWarn.apply(console, arguments);
        };
        var origError = console.error;
        console.error = function() {
            var args = Array.prototype.slice.call(arguments).join(' ');
            window.sunbirdErrors.push(args);
            addLog('ERROR', args);
            origError.apply(console, arguments);
        };
    </script>

    <!-- Required local Sunbird dependencies -->
    <script src="file:///android_asset/sunbird/jquery.min.js"></script>
    <script src="file:///android_asset/sunbird/reflect.min.js"></script>
    <script src="file:///android_asset/sunbird/video.min.js"></script>
    <script src="file:///android_asset/sunbird/sunbird-video-player.js"></script>
</head>
<body>
    <div id="player-wrapper">
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div class="loading-text" id="status-text">Initializing Sunbird Video Player...</div>
        </div>
        <div id="player-mount" style="width:100%; height:100%;"></div>
    </div>

    <script>
        // Official Sunbird Player Configuration Template (Standard Sunbird Schema)
        var defaultPlayerConfig = {
            "context": {
                "mode": "play",
                "partner": [],
                "pdata": {
                    "id": "staging.sunbird.portal",
                    "ver": "5.1.0",
                    "pid": "sunbird-portal.contentplayer"
                },
                "contentId": "do_sample_sunbird_video",
                "sid": "session_" + Date.now(),
                "uid": "anonymous_tester",
                "timeDiff": 0,
                "contextRollup": { "l1": "do_sample_sunbird_video" },
                "channel": "505c7c4851a0f41d4fa4f1320e24f2ab",
                "did": "device_" + Math.random().toString(36).substring(2, 9),
                "authtoken": "",
                "dims": [],
                "tags": [],
                "app": ["org.sunbird.app"],
                "cdata": [],
                "userData": { "firstName": "Sunbird", "lastName": "Learner" }
            },
            "config": {
                "traceId": "trace_" + Date.now(),
                "sideMenu": {
                    "showShare": false,
                    "showDownload": false,
                    "showReplay": true,
                    "showExit": false
                }
            },
            "metadata": {
                "identifier": "do_sample_sunbird_video",
                "name": "Sunbird Official Sample Video",
                "artifactUrl": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
                "streamingUrl": "",
                "mimeType": "video/mp4",
                "pkgVersion": 1,
                "mediaType": "content",
                "contentType": "Resource",
                "primaryCategory": "Learning Resource",
                "trackable": { "enabled": "No" }
            }
        };

        var currentConfig = defaultPlayerConfig;
        var playerElement = null;

        // Initialize Player using customElements.whenDefined
        function initSunbirdPlayer(configJson) {
            if (configJson) {
                try {
                    currentConfig = typeof configJson === 'string' ? JSON.parse(configJson) : configJson;
                } catch(e) {
                    console.error('[Engine 2] Failed to parse custom player config:', e);
                }
            }

            var statusEl = document.getElementById('status-text');
            if (statusEl) statusEl.innerText = "Registering Sunbird Component...";

            // Verify Custom Elements Registry and wait for sunbird-video-player
            if (typeof customElements === 'undefined') {
                console.error('[Engine 2] customElements not supported');
                if (statusEl) statusEl.innerText = "Error: customElements not supported";
                return;
            }

            customElements.whenDefined('sunbird-video-player').then(function() {
                console.log('[Engine 2] customElements.whenDefined(sunbird-video-player) resolved!');
                if (statusEl) statusEl.innerText = "Mounting Sunbird Player...";

                var mount = document.getElementById('player-mount');
                if (!mount) return;

                mount.innerHTML = '';

                playerElement = document.createElement('sunbird-video-player');
                playerElement.id = 'sunbird-player';
                playerElement.setAttribute('player-config', JSON.stringify(currentConfig));

                // Listen to Sunbird Player Events
                playerElement.addEventListener('playerEvent', function(e) {
                    var detail = e.detail || {};
                    window.lastPlayerEvents.push(detail);
                    if (window.lastPlayerEvents.length > 20) window.lastPlayerEvents.shift();
                    console.log('[Engine 2] PlayerEvent received:', detail.type);
                    if (detail.type === 'LOADEDMETADATA' || detail.type === 'PLAY') {
                        var overlay = document.getElementById('loading-overlay');
                        if (overlay) overlay.style.display = 'none';
                    }
                });

                // Listen to Sunbird Telemetry Events
                playerElement.addEventListener('telemetryEvent', function(e) {
                    var detail = e.detail || {};
                    console.log('[Engine 2] TelemetryEvent received:', detail.eid);
                });

                mount.appendChild(playerElement);

                setTimeout(function() {
                    var overlay = document.getElementById('loading-overlay');
                    if (overlay) overlay.style.display = 'none';
                    sendDiagnostics();
                }, 1000);
            }).catch(function(err) {
                console.error('[Engine 2] whenDefined error:', err);
                if (statusEl) statusEl.innerText = "Error defining Sunbird component";
            });
        }

        // Speed Control API
        window.setSunbirdPlaybackSpeed = function(targetSpeed) {
            var speed = parseFloat(targetSpeed);
            if (isNaN(speed) || speed <= 0) {
                return JSON.stringify({ success: false, error: 'Invalid speed value' });
            }

            var videoEl = document.querySelector('sunbird-video-player video, #video-player_html5_api, video');
            if (!videoEl) {
                var errResp = {
                    success: false,
                    requestedSpeed: speed,
                    actualSpeed: 0,
                    error: 'Underlying video element not found inside sunbird-video-player'
                };
                if (window.SunbirdBridge && window.SunbirdBridge.onSpeedResult) {
                    window.SunbirdBridge.onSpeedResult(JSON.stringify(errResp));
                }
                return JSON.stringify(errResp);
            }

            // Apply playbackRate to underlying video element and defaultPlaybackRate
            videoEl.playbackRate = speed;
            videoEl.defaultPlaybackRate = speed;

            // Read back actual speed
            var actualSpeed = videoEl.playbackRate;
            var isMatch = Math.abs(actualSpeed - speed) < 0.01;

            var result = {
                success: isMatch,
                requestedSpeed: speed,
                actualSpeed: actualSpeed,
                status: isMatch ? "SUCCESS" : "RATE_MISMATCH",
                currentTime: videoEl.currentTime,
                duration: videoEl.duration,
                paused: videoEl.paused,
                readyState: videoEl.readyState,
                timestamp: Date.now()
            };

            console.log('[Engine 2] Speed applied:', 'Requested=' + speed + 'x, Actual=' + actualSpeed + 'x, Success=' + isMatch);

            if (window.SunbirdBridge && window.SunbirdBridge.onSpeedResult) {
                window.SunbirdBridge.onSpeedResult(JSON.stringify(result));
            }
            return JSON.stringify(result);
        };

        // Diagnostics Retrieval API
        window.getSunbirdDiagnostics = function() {
            var customElementDefined = typeof customElements !== 'undefined' && customElements.get('sunbird-video-player') !== undefined;
            var playerElemPresent = document.querySelector('sunbird-video-player') !== null;
            var videoEl = document.querySelector('sunbird-video-player video, #video-player_html5_api, video');

            var diag = {
                customElementDefined: customElementDefined,
                playerElementPresent: playerElemPresent,
                videoElementPresent: videoEl !== null,
                videoReadyState: videoEl ? videoEl.readyState : 0,
                isPaused: videoEl ? videoEl.paused : true,
                currentTime: videoEl ? videoEl.currentTime : 0,
                duration: videoEl ? videoEl.duration : 0,
                currentPlaybackRate: videoEl ? videoEl.playbackRate : 1.0,
                videoSrc: videoEl ? videoEl.src : '',
                errors: window.sunbirdErrors,
                recentLogs: window.sunbirdLogs.slice(-10),
                recentEvents: window.lastPlayerEvents.slice(-5),
                timestamp: Date.now()
            };

            return JSON.stringify(diag);
        };

        function sendDiagnostics() {
            var json = window.getSunbirdDiagnostics();
            if (window.SunbirdBridge && window.SunbirdBridge.onDiagnostics) {
                window.SunbirdBridge.onDiagnostics(json);
            }
        }

        window.playVideo = function() {
            var videoEl = document.querySelector('sunbird-video-player video, #video-player_html5_api, video');
            if (videoEl) {
                videoEl.play().catch(function(e) { console.error('Play error:', e); });
            }
        };

        window.pauseVideo = function() {
            var videoEl = document.querySelector('sunbird-video-player video, #video-player_html5_api, video');
            if (videoEl) {
                videoEl.pause();
            }
        };

        // Auto start initialization on DOM load
        document.addEventListener('DOMContentLoaded', function() {
            initSunbirdPlayer(null);
        });
    </script>
</body>
</html>
